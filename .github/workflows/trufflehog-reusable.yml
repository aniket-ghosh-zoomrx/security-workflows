name: TruffleHog Secret Scan (reusable)

# Reusable secret-scanning workflow. Call it from any repo with a tiny caller
# workflow (see ../../caller-template.yml). Runs entirely on a GitHub-hosted
# Ubuntu runner — no local tooling required (important: developer machines here
# are WDAC-enforced and cannot run the TruffleHog CLI locally).

on:
  workflow_call:
    inputs:
      extra_args:
        description: "Args passed to the TruffleHog action. Default = verified-only. (Do NOT add --fail here — the action injects it; passing it twice errors with 'flag fail cannot be repeated'. The build still fails on a verified finding.)"
        required: false
        type: string
        default: "--results=verified"

permissions:
  contents: read

jobs:
  secret-scan:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so the action can diff base..head

      - name: TruffleHog secret scan
        # Pinned by full commit SHA (not @main) so an upstream branch push can't
        # silently change what runs in every enrolled repo. `version` pins the
        # scanner image tag too (avoids the mutable :latest). Bump both together
        # when upgrading; see README → "Upgrading the scanner".
        uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51  # v3.95.5
        with:
          version: "v3.95.5"
          extra_args: ${{ inputs.extra_args }}
